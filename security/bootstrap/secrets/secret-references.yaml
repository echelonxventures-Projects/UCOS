# =============================================================================
# UCOS PI-1 — WI-SEED.5 Secrets & Key Bootstrap — SECRET REFERENCES ONLY
# ADR-006 (secrets manager / KMS — neutral contract).
#
# !!! THIS FILE CONTAINS NO SECRETS. REFERENCES ONLY (S3 / SEC-CTL-005). !!!
# Each entry is an OPAQUE handle (external://...) resolved at runtime by the
# secrets/KMS primitive. No value, password, token, or key is ever stored here.
# A literal secret in this file is a GATE-SEC-001 S3 failure + §8.3 stop-work.
# =============================================================================
apiVersion: ucos.security/v1
kind: SecretReferenceManifest
metadata:
  name: pi1-secret-references
  labels:
    ucos.io/pi: "PI-1"
    ucos.io/control-s3: "SEC-CTL-005"
    ucos.io/control-s4: "SEC-CTL-009"
spec:
  # Format: logical-name -> external reference handle (NOT a value).
  references:
    mesh_ca_key:        "external://kms/pi1/mesh-ca"            # WI-SEED.3 mTLS CA (S1/S4)
    at_rest_data_key:   "external://kms/pi1/persistence-atrest" # WP-PLT-02 encryption-at-rest (S4)
    signing_key:        "external://kms/pi1/artifact-signing"   # WI-SEED.4 cosign signing (S3)
    registry_db_cred:   "external://secrets/pi1/registry-db"    # WP-PLT-06 SoR credential (S3)
    config_db_cred:     "external://secrets/pi1/config-db"      # WP-PLT-11 SoR credential (S3)
  policy:
    inlineSecretsAllowed: false   # non-waivable (S3 / P4)
    resolution: by-reference-only
    rotation: see security/bootstrap/secrets/rotation-policy.md
